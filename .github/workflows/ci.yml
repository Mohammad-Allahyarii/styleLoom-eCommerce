name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prettier --check .

      - run: npm run lint

      # npm run build runs tsc -b first, so this step also type-checks
      - run: npm run build
